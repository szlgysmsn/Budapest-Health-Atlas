name: Analyze Budapest district air quality
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/air-quality-analysis.yml"
      - "analysis/district_air_pollution.py"
      - "data/district_boundaries_*.geojson"

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial requirements
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "shapely>=2.0,<3" "pyproj>=3.6,<4"
      - name: Compute actual 23-district spatial overlays
        run: python analysis/district_air_pollution.py
      - name: Commit derived tables and methods
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/air_pollution_by_district.csv data/air_pollution_analysis_summary.json AIR_POLLUTION_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Add EEA-derived Budapest district air pollution area means"
            git push
          fi
